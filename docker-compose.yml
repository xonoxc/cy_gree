version: '3'
services:
  db:
    image: postgres
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432  

    environment:
      - POSTGRES_DB=cygree
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=secret

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
